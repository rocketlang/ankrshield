<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
    <title>ankrshield</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: #1a1a1a;
        color: #ffffff;
        overflow: hidden;
      }
      #root {
        width: 100vw;
        height: 100vh;
      }
      .container {
        padding: 2rem;
        max-width: 1200px;
        margin: 0 auto;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid #333;
      }
      .logo {
        font-size: 1.5rem;
        font-weight: 700;
        color: #4CAF50;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .status-indicator {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #4CAF50;
      }
      .score-card {
        background: #2a2a2a;
        border-radius: 12px;
        padding: 2rem;
        margin-bottom: 2rem;
        text-align: center;
      }
      .score-value {
        font-size: 4rem;
        font-weight: 700;
        color: #4CAF50;
        margin-bottom: 0.5rem;
      }
      .score-label {
        font-size: 1rem;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .score-level {
        font-size: 1.5rem;
        color: #4CAF50;
        margin-top: 0.5rem;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .stat-card {
        background: #2a2a2a;
        border-radius: 8px;
        padding: 1.5rem;
      }
      .stat-value {
        font-size: 2rem;
        font-weight: 700;
        color: #fff;
      }
      .stat-label {
        font-size: 0.875rem;
        color: #aaa;
        margin-top: 0.5rem;
      }
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-size: 1.5rem;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">Loading ankrshield...</div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
